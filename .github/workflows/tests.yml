name: tests

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boxlang: [ "cli-1.19.0", "cli" ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: boxlang-express-mvc
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: robertz/boxlang-express
          path: boxlang-express
          persist-credentials: false

      # TestBox comes from BoxExpress's box.json; WireBox is only needed
      # for the injector spec, which skips itself without it.
      - name: Install TestBox and WireBox
        run: |
          docker run --rm -v "$PWD:/work" -w /work/boxlang-express ortussolutions/commandbox:jdk21-alpine-3.24.0@sha256:1d4d0372947e703a2e4596d689c96f684d0c03c957e8c81a846a49221c65ceec box install
          docker run --rm -v "$PWD:/work" -w /work/boxlang-express-mvc ortussolutions/commandbox:jdk21-alpine-3.24.0@sha256:1d4d0372947e703a2e4596d689c96f684d0c03c957e8c81a846a49221c65ceec box install wirebox --production

      - name: Run the specs
        run: |
          docker run --rm -v "$PWD:/work" -w /work/boxlang-express-mvc ortussolutions/boxlang:${{ matrix.boxlang }} \
            sh -c "boxlang setup-tests.bxs && boxlang run-tests.bxs"
